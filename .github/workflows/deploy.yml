name: Pages note

# The game is served from Render (render.yaml). GitHub Pages only shows a note
# that links there, on the home page and on any old deep link (404.html).

on:
  push:
    branches: [main]
    paths: [pages-note/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp pages-note/index.html pages-note/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-note
      - id: deployment
        uses: actions/deploy-pages@v4
