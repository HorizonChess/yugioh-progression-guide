name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Public Cloudflare R2 bucket that serves the card and pack images
      NEXT_PUBLIC_IMAGE_HOST: https://pub-9397530dccf24d04a56c8eafb6e3edd0.r2.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # API tests start an in-memory MongoDB; keep its binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # The duel engine's card scripts and data, pinned to exact commits (tests play real duels).
      - uses: actions/cache@v4
        with:
          path: api/engine-data
          key: engine-data-${{ hashFiles('api/scripts/fetch-engine.ts') }}
      - run: npm run fetch-engine -w @ygo/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
