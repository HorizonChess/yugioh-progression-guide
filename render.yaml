# Render Blueprint: one web service serves the site (web/out), /api and /ws from
# a single origin. Create it in Render via New → Blueprint, pointing at this repo.
services:
  - type: web
    name: ygo-progression
    runtime: node
    plan: free
    # Keep this in the same part of the world as the Atlas cluster.
    region: frankfurt
    branch: main
    # NODE_ENV=production would make npm skip devDependencies the build needs.
    buildCommand: npm ci --include=dev && npm run fetch-engine -w @ygo/api && npm run build -w web && npm run build -w @ygo/api
    startCommand: node api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: WEB_DIST
        value: web/out
      - key: MONGODB_DB
        value: ygo-progression
      - key: IMAGE_HOST
        value: https://pub-9397530dccf24d04a56c8eafb6e3edd0.r2.dev
      - key: NEXT_PUBLIC_IMAGE_HOST
        value: https://pub-9397530dccf24d04a56c8eafb6e3edd0.r2.dev
      # Entered in the Render dashboard, never committed (Render asks for each one).
      - key: MONGODB_URI
        sync: false
      # The service's own https URL, e.g. https://ygo-progression.onrender.com:
      # email links and the Google redirect are built from it.
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Free plans can't reach SMTP: mail then goes through the Gmail API (npm run gmail-token -w @ygo/api).
      - key: GMAIL_REFRESH_TOKEN
        sync: false
