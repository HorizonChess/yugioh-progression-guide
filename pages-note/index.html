<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yu-Gi-Oh! Progression Series has moved</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            background: #0b0a12;
            color: #e8e2d0;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }
        main {
            max-width: 32rem;
            padding: 2rem 1.5rem;
            border: 1px solid #b8913b;
            background: #15131f;
        }
        h1 { margin: 0 0 1rem; color: #e0b54f; font-size: 1.6rem; letter-spacing: 0.05em; }
        p { line-height: 1.5; }
        a.go {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #e0b54f;
            color: #15131f;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-decoration: none;
        }
        a.go:hover, a.go:focus-visible { background: #f3cf72; }
        small { display: block; margin-top: 1.5rem; color: #9a937f; }
    </style>
</head>
<body>
    <main>
        <h1>The Progression Series has moved</h1>
        <p>The game now lives at a new address, with accounts and duo series against a rival.</p>
        <a class="go" href="https://ygo-progression.onrender.com/">GO TO THE NEW SITE</a>
        <small>Saves made on this old address stay in this browser and don't carry over.</small>
    </main>
</body>
</html>
